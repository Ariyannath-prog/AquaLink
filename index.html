<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AquaLink</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #ui {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-start;
    }

    .panel {
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 18px;
      pointer-events: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .panel h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button {
      background: rgba(255, 255, 255, 0.08);
      color: #e0e0e0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.2);
    }

    button.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
    }

    .status {
      font-size: 12px;
      color: #a0a0a0;
      margin-top: 10px;
      max-width: 280px;
      line-height: 1.4;
    }

    .status.loading {
      color: #60a5fa;
    }

    .status.error {
      color: #f87171;
    }

    .status.success {
      color: #4ade80;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(96, 165, 250, 0.3);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #help {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 12px;
      color: #a0a0a0;
      line-height: 1.5;
      max-width: 320px;
      pointer-events: none;
    }

    #help strong {
      color: #e0e0e0;
    }

    #models-panel {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      pointer-events: auto;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      max-width: 320px;
    }

    #models-panel h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .models-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .model-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #e0e0e0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .model-btn.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
    }

    @media (max-width: 1024px) {
      #models-panel {
        max-width: 280px;
        right: 12px;
        bottom: 12px;
      }

      .models-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }

      .model-btn {
        font-size: 11px;
        padding: 8px 10px;
      }
    }

    @media (max-width: 640px) {
      #ui {
        padding: 12px;
      }

      .panel {
        width: 100%;
      }

      .controls {
        gap: 6px;
      }

      button {
        flex: 1 1 calc(50% - 6px);
      }

      #help {
        display: none;
        font-size: 11px;
      }

      #models-panel {
        position: fixed;
        bottom: max(12px, env(safe-area-inset-bottom));
        right: auto;
        top: auto;
        left: 12px;
        width: calc(100% - 24px);
        max-width: none;
        max-height: min(28dvh, 220px);
        z-index: 15;
        padding: 12px;
      }

      #models-panel h2 {
        font-size: 13px;
        margin-bottom: 10px;
      }

      .models-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }

      .model-btn {
        font-size: 10px;
        padding: 6px 8px;
      }
    }

    @media (max-width: 380px) {
      .models-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      button {
        font-size: 12px;
        padding-inline: 8px;
      }
    }

    @media (min-width: 641px) {
      #canvas-container {
        height: 100vh;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui">
    <div class="panel">
      <h1>3D Model Viewer</h1>
      <div class="controls">
        <button id="btn-reset">Reset Camera</button>
        <button id="btn-wireframe">Wireframe</button>
        <button id="btn-auto-rotate">Auto Rotate</button>
      </div>
      <div id="status" class="status">Loading model…</div>
    </div>
  </div>

  <div id="models-panel">
    <h2>Models</h2>
    <div class="models-grid" id="models-grid"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    const container = document.getElementById("canvas-container");
    const statusEl = document.getElementById("status");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0d0d);

    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.01,
      1000
    );
    camera.position.set(2, 1.5, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
    scene.add(hemi);

    const dir = new THREE.DirectionalLight(0xffffff, 1.2);
    dir.position.set(5, 10, 7);
    scene.add(dir);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = true;
    controls.minDistance = 0.1;
    controls.maxDistance = 100;
    controls.target.set(0, 0.5, 0);

    let currentModel = null;
    let wireframe = false;
    let autoRotate = false;
    const loader = new GLTFLoader();

    function googleDriveDownloadUrl(fileId) {
      return `https://drive.google.com/uc?export=download&id=${fileId}`;
    }

    const models = [
      { name: "full_model", label: "Full Model", file: googleDriveDownloadUrl("1MgQh9cWVtqwZEJX-R980wb-Y798l69u3") },
      { name: "motor", label: "Motor", file: googleDriveDownloadUrl("1QgEW_J9SmamH1gVHrTwl5VPzi_0xJHcA") },
      { name: "arduino", label: "Arduino", file: googleDriveDownloadUrl("1KaN2FJzAaNhVxnxNZabdZxsXVKBx5PVk") },
      { name: "esp", label: "ESP", file: googleDriveDownloadUrl("1mZB0Ytc6cw0P5H8GY9jrwf8g9hIONPSg") },
      { name: "gyro", label: "Gyro", file: googleDriveDownloadUrl("19LonJzeLSk6xQuZ0j0P6yJ9aW5gCxVnh") },
      { name: "battery", label: "Battery", file: googleDriveDownloadUrl("12qp1yCUAvR7xBpkAoEXEpdMpz0-FF9Rd") },
      { name: "camera", label: "Camera", file: googleDriveDownloadUrl("1mxMkVuadNURHcXzjtW6UgZxIXjjh21nM") },
    ];

    let currentModelName = null;

    function setStatus(msg, type = "") {
      statusEl.className = "status " + type;
      statusEl.innerHTML = msg;
    }

    function clearModel() {
      if (currentModel) {
        scene.remove(currentModel);
        currentModel.traverse((child) => {
          if (child.isMesh) {
            child.geometry?.dispose();
            if (Array.isArray(child.material)) {
              child.material.forEach((m) => m.dispose());
            } else {
              child.material?.dispose();
            }
          }
        });
        currentModel = null;
      }
    }

    function fitCameraToObject(object) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      const maxDim = Math.max(size.x, size.y, size.z);
      const fov = camera.fov * (Math.PI / 180);
      let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
      cameraZ *= 1.6;

      camera.position.set(center.x + cameraZ * 0.6, center.y + cameraZ * 0.4, center.z + cameraZ);
      controls.target.copy(center);
      controls.update();

      camera.near = maxDim / 100;
      camera.far = maxDim * 100;
      camera.updateProjectionMatrix();
    }

    function applyWireframe(enabled) {
      if (!currentModel) return;
      currentModel.traverse((child) => {
        if (child.isMesh && child.material) {
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          mats.forEach((m) => {
            m.wireframe = enabled;
          });
        }
      });
    }

    function loadGLB(fileOrUrl, name = "model") {
      clearModel();
      currentModelName = Object.values(models).find(m => m.file === fileOrUrl)?.name || name;
      setStatus(`<span class="spinner"></span>Loading ${name}…`, "loading");

      const onLoad = (gltf) => {
        currentModel = gltf.scene;
        scene.add(currentModel);

        const box = new THREE.Box3().setFromObject(currentModel);
        const center = box.getCenter(new THREE.Vector3());
        currentModel.position.sub(center);

        fitCameraToObject(currentModel);
        applyWireframe(wireframe);

        setStatus(`Loaded: <strong>${name}</strong>`, "success");
        updateModelButtonStates();
      };

      const onError = (err) => {
        console.error(err);
        setStatus(`Failed to load model: ${err.message || err}`, "error");
      };

      if (typeof fileOrUrl === "string") {
        loader.load(fileOrUrl, onLoad, undefined, onError);
      }
    }

    function updateModelButtonStates() {
      document.querySelectorAll(".model-btn").forEach((btn) => {
        const modelName = btn.dataset.model;
        btn.classList.toggle("active", modelName === currentModelName);
      });
    }

    function initializeModelGrid() {
      const grid = document.getElementById("models-grid");
      grid.innerHTML = "";

      models.forEach((model) => {
        const btn = document.createElement("button");
        btn.className = "model-btn";
        btn.textContent = model.label;
        btn.dataset.model = model.name;
        btn.addEventListener("click", () => {
          loadGLB(model.file, model.label);
        });
        grid.appendChild(btn);
      });
    }

    document.getElementById("btn-reset").addEventListener("click", () => {
      if (currentModel) fitCameraToObject(currentModel);
      else {
        camera.position.set(2, 1.5, 3);
        controls.target.set(0, 0.5, 0);
        controls.update();
      }
    });

    const btnWire = document.getElementById("btn-wireframe");
    btnWire.addEventListener("click", () => {
      wireframe = !wireframe;
      btnWire.classList.toggle("active", wireframe);
      applyWireframe(wireframe);
    });

    const btnAuto = document.getElementById("btn-auto-rotate");
    btnAuto.addEventListener("click", () => {
      autoRotate = !autoRotate;
      controls.autoRotate = autoRotate;
      btnAuto.classList.toggle("active", autoRotate);
    });

    renderer.domElement.addEventListener("dblclick", () => {
      if (currentModel) fitCameraToObject(currentModel);
    });

    function resizeRenderer() {
      const width = container.clientWidth;
      const height = container.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
    }

    window.addEventListener("resize", resizeRenderer);
    window.visualViewport?.addEventListener("resize", resizeRenderer);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    initializeModelGrid();
    loadGLB(models[0].file, models[0].label);
  </script>
</body>
</html>
