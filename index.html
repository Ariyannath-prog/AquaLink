<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <title>AquaLink</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #ui {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-start;
    }

    .panel {
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 18px;
      pointer-events: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .panel h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button {
      background: rgba(255, 255, 255, 0.08);
      color: #e0e0e0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.2);
    }

    button:focus-visible {
      outline: 2px solid #93c5fd;
      outline-offset: 2px;
    }

    button.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
    }

    .status {
      font-size: 12px;
      color: #a0a0a0;
      margin-top: 10px;
      max-width: 280px;
      line-height: 1.4;
    }

    .status.loading {
      color: #60a5fa;
    }

    .status.error {
      color: #f87171;
    }

    .status.success {
      color: #4ade80;
    }

    .status a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(96, 165, 250, 0.3);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #help {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 12px;
      color: #a0a0a0;
      line-height: 1.5;
      max-width: 320px;
      pointer-events: none;
    }

    #help strong {
      color: #e0e0e0;
    }

    #models-panel {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      pointer-events: auto;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      max-width: 320px;
    }

    #models-panel h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .models-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .model-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #e0e0e0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .model-btn.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
    }

    @media (max-width: 1024px) {
      #models-panel {
        max-width: 280px;
        right: 12px;
        bottom: 12px;
      }

      .models-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }

      .model-btn {
        font-size: 11px;
        padding: 8px 10px;
      }
    }

    @media (max-width: 640px) {
      #ui {
        padding: 12px;
      }

      .panel {
        width: 100%;
      }

      .controls {
        gap: 6px;
      }

      button {
        flex: 1 1 calc(50% - 6px);
      }

      #help {
        display: none;
        font-size: 11px;
      }

      #models-panel {
        position: fixed;
        bottom: max(12px, env(safe-area-inset-bottom));
        right: auto;
        top: auto;
        left: 12px;
        width: calc(100% - 24px);
        max-width: none;
        max-height: min(28dvh, 220px);
        z-index: 15;
        padding: 12px;
      }

      #models-panel h2 {
        font-size: 13px;
        margin-bottom: 10px;
      }

      .models-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }

      .model-btn {
        font-size: 10px;
        padding: 6px 8px;
      }
    }

    @media (max-width: 380px) {
      .models-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      button {
        font-size: 12px;
        padding-inline: 8px;
      }
    }

    @media (min-width: 641px) {
      #canvas-container {
        height: 100vh;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui">
    <div class="panel">
      <h1>AquaLink 3D Viewer</h1>
      <div class="controls">
        <button id="btn-reset" type="button">Reset Camera</button>
        <button id="btn-wireframe" type="button" aria-pressed="false">Wireframe</button>
        <button id="btn-auto-rotate" type="button" aria-pressed="false">Auto Rotate</button>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">Preparing model viewer…</div>
    </div>
  </div>

  <div id="models-panel">
    <h2>Models</h2>
    <div class="models-grid" id="models-grid"></div>
  </div>

  <div id="help">
    <strong>Controls</strong><br />
    Drag to orbit · Scroll or pinch to zoom · Double-click to frame
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

    const container = document.getElementById("canvas-container");
    const statusEl = document.getElementById("status");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0d0d);

    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.01,
      1000
    );
    camera.position.set(2, 1.5, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
    scene.add(hemi);

    const dir = new THREE.DirectionalLight(0xffffff, 1.2);
    dir.position.set(5, 10, 7);
    scene.add(dir);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = true;
    controls.minDistance = 0.1;
    controls.maxDistance = 100;
    controls.target.set(0, 0.5, 0);

    let currentModel = null;
    let currentModelName = null;
    let activeRequest = null;
    let loadVersion = 0;
    let models = [];
    let wireframe = false;
    let autoRotate = false;
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath("https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/gltf/");
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);
    loader.setMeshoptDecoder(MeshoptDecoder);

    function setStatus(message, type = "") {
      statusEl.className = `status ${type}`;
      statusEl.textContent = message;
    }

    function setLoadingStatus(model, progressEvent) {
      const loadedMegabytes = progressEvent?.loaded
        ? ` (${Math.round(progressEvent.loaded / 1024 / 1024)} MB)`
        : "";
      const percent = progressEvent?.lengthComputable
        ? ` ${Math.round((progressEvent.loaded / progressEvent.total) * 100)}%`
        : "";

      statusEl.className = "status loading";
      const spinner = document.createElement("span");
      spinner.className = "spinner";
      statusEl.replaceChildren(spinner, `Loading ${model.label}${percent}${loadedMegabytes}…`);
    }

    function getDriveViewUrl(model) {
      return `https://drive.google.com/file/d/${model.driveId}/view?usp=sharing`;
    }

    function getModelAssetUrl(model) {
      return new URL(`models/${model.file}`, document.baseURI).href;
    }

    function showLoadError(model, error) {
      console.error(`Unable to load ${model.label}`, error);
      statusEl.className = "status error";

      const driveLink = document.createElement("a");
      driveLink.href = getDriveViewUrl(model);
      driveLink.target = "_blank";
      driveLink.rel = "noopener noreferrer";
      driveLink.textContent = "Open the original file in Google Drive";

      statusEl.replaceChildren(
        `Couldn’t load ${model.label}. `,
        driveLink,
        ". The GitHub Pages deployment may still be building."
      );
    }

    function disposeObject(object) {
      const geometries = new Set();
      const materials = new Set();
      const textures = new Set();

      object.traverse((child) => {
        if (!child.isMesh) return;

        if (child.geometry && !geometries.has(child.geometry)) {
          geometries.add(child.geometry);
          child.geometry.dispose();
        }

        const childMaterials = Array.isArray(child.material) ? child.material : [child.material];
        childMaterials.filter(Boolean).forEach((material) => {
          if (materials.has(material)) return;
          materials.add(material);

          Object.values(material).forEach((value) => {
            if (value?.isTexture && !textures.has(value)) {
              textures.add(value);
              value.dispose();
            }
          });
          material.dispose();
        });
      });
    }

    function clearModel() {
      if (!currentModel) return;
      scene.remove(currentModel);
      disposeObject(currentModel);
      currentModel = null;
    }

    function cancelPendingRequest() {
      if (activeRequest?.abort) activeRequest.abort();
      activeRequest = null;
    }

    function fitCameraToObject(object) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);

      if (!Number.isFinite(maxDim) || maxDim <= 0) return;

      const fov = camera.fov * (Math.PI / 180);
      const cameraDistance = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.6;

      camera.position.set(
        center.x + cameraDistance * 0.6,
        center.y + cameraDistance * 0.4,
        center.z + cameraDistance
      );
      controls.target.copy(center);
      controls.minDistance = Math.max(maxDim / 100, 0.01);
      controls.maxDistance = Math.max(cameraDistance * 8, 2);
      camera.near = Math.max(maxDim / 1000, 0.001);
      camera.far = Math.max(maxDim * 100, 10);
      camera.updateProjectionMatrix();
      controls.update();
    }

    function applyWireframe(enabled) {
      if (!currentModel) return;
      currentModel.traverse((child) => {
        if (!child.isMesh || !child.material) return;
        const materials = Array.isArray(child.material) ? child.material : [child.material];
        materials.forEach((material) => {
          material.wireframe = enabled;
          material.needsUpdate = true;
        });
      });
    }

    function loadModel(model) {
      const requestVersion = ++loadVersion;
      cancelPendingRequest();
      clearModel();
      currentModelName = model.name;
      updateModelButtonStates();
      setLoadingStatus(model);

      activeRequest = loader.load(
        getModelAssetUrl(model),
        (gltf) => {
          if (requestVersion !== loadVersion) {
            disposeObject(gltf.scene);
            return;
          }

          activeRequest = null;
          currentModel = gltf.scene;
          scene.add(currentModel);

          const box = new THREE.Box3().setFromObject(currentModel);
          currentModel.position.sub(box.getCenter(new THREE.Vector3()));
          fitCameraToObject(currentModel);
          applyWireframe(wireframe);

          setStatus(`Loaded: ${model.label}`, "success");
        },
        (event) => {
          if (requestVersion === loadVersion) setLoadingStatus(model, event);
        },
        (error) => {
          if (requestVersion !== loadVersion) return;
          activeRequest = null;
          showLoadError(model, error);
        }
      );
    }

    function updateModelButtonStates() {
      document.querySelectorAll(".model-btn").forEach((btn) => {
        const isActive = btn.dataset.model === currentModelName;
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
      });
    }

    function initializeModelGrid() {
      const grid = document.getElementById("models-grid");
      grid.replaceChildren();

      models.forEach((model) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "model-btn";
        btn.textContent = model.label;
        btn.dataset.model = model.name;
        btn.setAttribute("aria-pressed", "false");
        btn.addEventListener("click", () => loadModel(model));
        grid.appendChild(btn);
      });
    }

    function validateModelManifest(manifest) {
      if (!Array.isArray(manifest) || manifest.length === 0) {
        throw new Error("The model manifest is empty.");
      }

      return manifest.map((model) => {
        const isValid =
          typeof model?.name === "string" &&
          typeof model.label === "string" &&
          typeof model.file === "string" &&
          typeof model.driveId === "string" &&
          /^[a-z0-9][a-z0-9-]*\.glb$/i.test(model.file) &&
          /^[a-zA-Z0-9_-]{20,}$/.test(model.driveId);

        if (!isValid) throw new Error("The model manifest contains an invalid entry.");
        return model;
      });
    }

    async function initializeModels() {
      setStatus("Loading model catalogue…", "loading");
      try {
        const response = await fetch(new URL("models.json", document.baseURI));
        if (!response.ok) throw new Error(`Model manifest returned ${response.status}`);
        models = validateModelManifest(await response.json());
        initializeModelGrid();
        loadModel(models[0]);
      } catch (error) {
        console.error("Unable to initialize models", error);
        setStatus("Couldn’t read the model catalogue. Check the Pages deployment.", "error");
      }
    }

    document.getElementById("btn-reset").addEventListener("click", () => {
      if (currentModel) fitCameraToObject(currentModel);
      else {
        camera.position.set(2, 1.5, 3);
        controls.target.set(0, 0.5, 0);
        controls.update();
      }
    });

    const btnWire = document.getElementById("btn-wireframe");
    btnWire.addEventListener("click", () => {
      wireframe = !wireframe;
      btnWire.classList.toggle("active", wireframe);
      btnWire.setAttribute("aria-pressed", String(wireframe));
      applyWireframe(wireframe);
    });

    const btnAuto = document.getElementById("btn-auto-rotate");
    btnAuto.addEventListener("click", () => {
      autoRotate = !autoRotate;
      controls.autoRotate = autoRotate;
      btnAuto.classList.toggle("active", autoRotate);
      btnAuto.setAttribute("aria-pressed", String(autoRotate));
    });

    renderer.domElement.addEventListener("dblclick", () => {
      if (currentModel) fitCameraToObject(currentModel);
    });

    function resizeRenderer() {
      const width = container.clientWidth;
      const height = container.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
    }

    window.addEventListener("resize", resizeRenderer);
    window.visualViewport?.addEventListener("resize", resizeRenderer);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    initializeModels();
  </script>
</body>
</html>
